# Lint/format configuration (Ruff). Run: ruff check . / ruff format .
line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "B008",   # FastAPI uses function calls in defaults (Depends(...))
    "RUF001", # emoji / unicode in seed copy is intentional
]

[lint.per-file-ignores]
"app/seed/*" = ["E501"]          # long demo strings
"tests/*" = ["E501", "S101"]
